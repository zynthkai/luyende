// ===== Parser đề thi chuẩn cấu trúc mới (Hỗ trợ [ĐOẠN VĂN], Cloze Test, Sắp xếp, Gạch chân) =====
function parse(t){
  const qs=[];let cq=null,cg='',ig=false,md='text',m;
  t.replace(/\r/g,'').split('\n').forEach(ln=>{
    const tr=ln.trim();
    if(/^\[ĐOẠN VĂN\]$/i.test(tr)){ig=true;cg='';return}
    if(/^\[\/ĐOẠN VĂN\]$/i.test(tr)){ig=false;return}
    if(ig){cg+=(cg?'\n':'')+tr;return}
    if(m=tr.match(/^\s*Câu\s*(\d+)\s*[:.]\s*(.*)$/i)){
      if(cq)qs.push(cq);
      const qNum=m[1],rawTxt=m[2].replace(/\s*\|\s*/g,'\n').trim();
      cq={num:qNum,text:rawTxt,mc:[],tf:[],sa:null,exp:'',group:cg};md='text';
    }else if(cq){
      if(m=tr.match(/^\s*(\*)?\s*([A-D])\.\s*(.*)$/)){cq.mc.push({t:m[3],c:!!m[1]});md='mc'}
      else if(m=tr.match(/^\s*(\*)?\s*([a-d])\)\s*(.*)$/)){cq.tf.push({t:m[3],c:!!m[1]});md='tf'}
      else if(m=tr.match(/^\s*\*\s*(?:ĐA|KQ)\s*:\s*(.*)$/i)){cq.sa=m[1].split('|').map(s=>s.trim()).filter(Boolean);md='sa'}
      else if(m=tr.match(/^\s*\*\s*GT\s*:\s*(.*)$/i)){cq.exp=m[1];md='exp'}
      else if(tr){
        if(md=='text')cq.text+=(cq.text?'\n':'')+tr.replace(/\s*\|\s*/g,'\n');
        else if(md=='exp')cq.exp+='\n'+tr;
        else if(md=='mc'||md=='tf')cq[md].at(-1).t+=' '+tr;
      }
    }
  });
  if(cq)qs.push(cq);
  return qs.map((o,idx)=>{
    const num=o.num||(idx+1);
    const txt=o.text||`Chọn phương án đúng nhất để điền vào chỗ trống (${num}) trong đoạn văn:`;
    const x={num,text:txt,exp:o.exp,group:o.group||''};
    if(o.mc.length>1)return{...x,type:'mc',opts:o.mc.map(a=>a.t),ans:'ABCD'[o.mc.findIndex(a=>a.c)]||''};
    if(o.tf.length>1)return{...x,type:'tf',opts:o.tf.map(a=>a.t),ans:o.tf.map(a=>a.c)};
    if(o.sa)return{...x,type:'sa',ans:o.sa};return null
  }).filter(Boolean);
}

function toRaw(qs){
  let out='',lastG='';
  qs.forEach((x,i)=>{
    const g=x.group||'';
    if(g!==lastG){out+=(out?'\n':'')+`[ĐOẠN VĂN]\n${g}\n[/ĐOẠN VĂN]\n`;lastG=g}
    out+=(out?'\n':'')+`Câu ${x.num||(i+1)}: ${x.text}\n`;
    if(x.type=='mc')x.opts.forEach((o,k)=>out+=`${'ABCD'[k]==x.ans?'*':''}${'ABCD'[k]}. ${o}\n`);
    else if(x.type=='tf')x.opts.forEach((o,k)=>out+=`${x.ans[k]?'*':''}${'abcd'[k]}) ${o}\n`);
    else if(x.type=='sa')out+=`*ĐA: ${x.ans.join(' | ')}\n`;
    if(x.exp)out+=`*GT: ${x.exp}\n`;
  });
  return out.trim();
}

function profile(){newAv=null;modal(`<h3 class="text-xl font-bold mb-3">Hồ sơ cá nhân</h3><div class="flex items-center gap-3 mb-3 flex-wrap"><img id="pa" src="${av(me)}" class="w-20 h-20 rounded-full border-2 border-[#438a72] object-cover"><div><div class="flex flex-wrap gap-1">${AVS.map(s=>{const u=`https://api.dicebear.com/7.x/adventurer/svg?seed=${s}`;return `<img src="${u}" class="w-10 h-10 rounded-full cursor-pointer hover:ring-2 ring-[#10b981]" onclick="setAv('${u}')">`}).join('')}</div><label class="btn b2 inline-block mt-2 cursor-pointer text-sm"><i class="fa fa-upload"></i> Tải ảnh lên<input type="file" accept="image/*" hidden onchange="upAv(this)"></label></div></div><div class="grid gap-2"><input id="pn" class="inp" value="${esc(me.name)}" placeholder="Họ và tên"><input id="pb" class="inp" value="${esc(me.bio)}" placeholder="Châm ngôn học tập"><select id="pc" class="inp">${clsOpts(me.classId)}</select><input id="pp" type="password" class="inp" placeholder="Mật khẩu mới (bỏ trống nếu không đổi)"></div><button class="btn bg mt-3" onclick="saveP()">Lưu hồ sơ</button>`)}
const setAv=u=>{newAv=u;$('#pa').src=u};
function upAv(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=150;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,150,150);setAv(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
async function saveP(){const n=$('#pn').value.trim();if(!n)return toast('Họ tên không được trống','err');Object.assign(me,{name:n,bio:$('#pb').value.trim(),classId:$('#pc').value});
 if(newAv)me.avatar=newAv;if($('#pp').value)me.pass=$('#pp').value;await save('users',me);modal('');toast('Đã cập nhật hồ sơ');render()}
// ===== Khởi động =====
(async()=>{try{await load()}catch(e){useFB=false;toast('Không kết nối được Firebase, chuyển sang localStorage','err');await load()}
 await seed();me=S.users.find(u=>u.id==localStorage.getItem('qz_me'))||null;render()})();
</script></body></html>
