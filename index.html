      else if(m=tr.match(/^\s*\*\s*(?:ĐA|KQ)\s*:\s*(.*)$/i)){cq.saL=li;cq.sa=m[1].split('|').map(s=>s.trim()).filter(Boolean);md='sa'}
      else if(m=tr.match(/^\s*\*\s*GT\s*:\s*(.*)$/i)){cq.exp=m[1];md='exp'}
      else if(tr){
        if(md=='text')cq.text+=(cq.text?'\n':'')+tr.replace(/\s*\|\s*/g,'\n');
        else if(md=='exp')cq.exp+='\n'+tr;
        else if(md=='mc'||md=='tf')cq[md].at(-1).t+=' '+tr;
      }
    }
  });
  if(cq)qs.push(cq);
  return qs.map((o,idx)=>{
    const num=o.num||(idx+1);
    const txt=o.text||`Chọn phương án đúng nhất để điền vào chỗ trống (${num}) trong đoạn văn:`;
    const x={num,text:txt,exp:o.exp,group:o.group||'',...(keepL?{_L:{mc:o.mc.map(a=>a.L),tf:o.tf.map(a=>a.L),sa:o.saL}}:{})};
    if(o.mc.length>1)return{...x,type:'mc',opts:o.mc.map(a=>a.t),ans:'ABCD'[o.mc.findIndex(a=>a.c)]||''};
    if(o.tf.length>1)return{...x,type:'tf',opts:o.tf.map(a=>a.t),ans:o.tf.map(a=>a.c)};
    if(o.sa)return{...x,type:'sa',ans:o.sa};return null
  }).filter(Boolean);
}

const ytParse=u=>{
  u=String(u||'').trim();
  const pl=u.match(/[?&]list=([\w-]+)/);
  if(pl){
    const lid=pl[1];
    if(/^RD/.test(lid)){
      const v=u.match(/[?&]v=([\w-]{11})/);
      return {type:'mix',id:lid,startVideo:v?v[1]:lid.slice(2)};
    }
    return {type:'playlist',id:lid};
  }
  const m=u.match(/(?:youtu\.be\/|v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  if(m)return{type:'video',id:m[1]};
  if(/^[\w-]{11}$/.test(u))return{type:'video',id:u};
  if(/^RD[\w-]+$/.test(u))return{type:'mix',id:u,startVideo:u.slice(2)};
  if(/^PL[\w-]+$/.test(u))return{type:'playlist',id:u};
  return null;
};
const ytLoad=()=>ytPr??=new Promise(r=>{if(window.YT?.Player)return r();window.onYouTubeIframeAPIReady=r;const e=document.createElement('script');e.src='https://www.youtube.com/iframe_api';document.head.append(e)});

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
const sp=(o,k,v)=>{const a=k.split('.');let c=o;a.slice(0,-1).forEach(x=>c=c[x]??={});c[a.at(-1)]=v};

const rGet=async id=>useFB?(await fdb.collection('rooms').doc(id).get()).data()||null:JSON.parse(localStorage.getItem(rkey(id))||'null');
async function rUpd(id,patch,app){
  if(useFB){const d={...patch};for(const k in app||{})d[k]=firebase.firestore.FieldValue.arrayUnion(app[k]);return fdb.collection('rooms').doc(id).update(d)}
  const o=JSON.parse(localStorage.getItem(rkey(id))||'null');if(!o)return;
  for(const k in patch)sp(o,k,patch[k]);
  for(const k in app||{}){(o[k]??=[]).push(app[k]);if(o[k].length>300)o[k]=o[k].slice(-300)}
  localStorage.setItem(rkey(id),JSON.stringify(o));rl[id]?.(o);
}
function rListen(id,cb){if(useFB)return fdb.collection('rooms').doc(id).onSnapshot(x=>cb(x.exists?x.data():null),()=>cb(null));
  rl[id]=cb;const h=e=>{if(e.key==rkey(id))cb(e.newValue?JSON.parse(e.newValue):null)};
  addEventListener('storage',h);cb(JSON.parse(localStorage.getItem(rkey(id))||'null'));
  return()=>{delete rl[id];removeEventListener('storage',h)};}

function roomMount(){
  if(!RM)return;
  if(!RM.un){RM.un=rListen(RM.id,roomUpd);RM.iv=setInterval(roomTick,1000)}
  RM.pl=null;RM.rdy=0;RM.mk=0;RM.sig='';RM.rev=RM.doc?.pb?.rev||0;
  RM.cvid=null;RM.csrcType=null;
  if(RM.doc&&$('#rvid')){RM.mk=1;ytMake()}
  roomPanel();
}
function roomUpd(d){
  if(!RM)return;
  if(!d){RM.dead=1;toast('Phòng không còn tồn tại','err');return go('rooms')}
  if(d.k?.[me.id]){RM.kicked=1;toast('Bạn đã bị mời ra khỏi phòng','err');return go('rooms')}
  if(d.ban?.[me.id]){RM.kicked=1;toast('Bạn đã bị cấm vào phòng này','err');return go('rooms')}
  const prev=RM.doc;RM.doc=d;
  if(!RM.mk&&$('#rvid')){RM.mk=1;ytMake()}
  
  const srcChanged = RM.rdy && (d.vid !== RM.cvid || d.srcType !== RM.csrcType);
  if(srcChanged) loadSource(d);
  
  roomPanel();
  if(d.pb && (d.pb.rev||0) > (RM.rev||0)) applyPb(d.pb);
}
function loadSource(d){
  RM.cvid=d.vid;RM.csrcType=d.srcType;
  try{
    if(d.srcType==='mix'){
      if (RM.pl.getPlaylistId && RM.pl.getPlaylistId() === d.vid) {
         RM.pl.loadVideoById(d.vid);
      } else {
         RM.pl.loadPlaylist({list:d.vid,listType:'playlist',index:1});
      }
    }else if(d.srcType==='playlist'){
      RM.pl.loadPlaylist({list:d.vid,listType:'playlist'});
    }else{
      RM.pl.loadVideoById(d.vid);
    }
  }catch(e){
    RM.mk=0;RM.rdy=0;ytMake();
  }
}

// ===== Player =====
function ytMake(){
  const d=RM.doc,h=isHost();RM.cvid=d.vid;RM.csrcType=d.srcType;
  ytLoad().then(()=>{
    if(!RM||!$('#rvid'))return;
    const isPL=d.srcType==='playlist';
    const isMix=d.srcType==='mix';
    let vars={
      playsinline:1,rel:0,modestbranding:1,
      controls:h?1:0,disablekb:h?0:1,
      enablejsapi:1,origin:location.origin
    };
    if(isMix){
      vars.listType='playlist';
      vars.list=d.vid;
      vars.index=1;
    }else if(isPL){
      vars.listType='playlist';
      vars.list=d.vid;
    }else{
      vars.videoId=d.vid;
    }
    RM.pl=new YT.Player('rvid',{
      height:'100%',width:'100%',host:'https://www.youtube.com',
      playerVars:vars,
      events:{
        onReady:()=>{
          RM.rdy=1;
          applyVol();
          if(h){
            if(d.pb?.t>0)RM.pl.seekTo(d.pb.t,true);
            RM.pl.playVideo();
            setTimeout(() => pub(true, RM.pl.getCurrentTime() || 0), 800);
          } else applyPb(d.pb,1);
          updateNowPlaying();
        },
        onStateChange:e=>{
          updateNowPlaying();
          if(!isHost()||!RM.rdy)return;
          const cur=RM.pl.getCurrentTime()||0;
          
          if (isMix && (e.data===1 || e.data===2)) {
             const newVid = RM.pl.getVideoData()?.video_id;
             if (newVid && newVid !== RM.cvid) {
                RM.cvid = newVid;
                rUpd(RM.id, {vid: newVid});
             }
          }

          if(e.data===1)pub(true,cur);
          else if(e.data===2)pub(false,cur);
          else if(e.data===0){
            if(isMix||isPL)return;
            const q=RM.doc.queue||[];
            if(q.length){
              const next=q[0],rest=q.slice(1);
              rUpd(RM.id,{vid:next,srcType:'video',queue:rest,pb:{p:false,t:0,rev:(RM.doc.pb?.rev||0)+1,ts:Date.now()}});
            }
          }
        }
      }
    });
  });
}

function applyVol(){
  if(!RM?.pl?.setVolume)return;
  try{
    RM.pl.setVolume(isMuted?0:myVol);
    if(isMuted&&RM.pl.mute)RM.pl.mute();
    else if(!isMuted&&RM.pl.unMute)RM.pl.unMute();
  }catch(e){}
}
function volIcon(){
  if(isMuted||myVol===0)return 'fa-volume-xmark';
  if(myVol<33)return 'fa-volume-low';
  if(myVol<66)return 'fa-volume';
  return 'fa-volume-high';
}
function volLabel(){
  if(isMuted)return 'Tắt tiếng';
  return myVol+'%';
}
function setVol(v){
  v=Math.max(0,Math.min(100,Math.round(v)));
  myVol=v;
  if(v>0&&isMuted){isMuted=false;localStorage.setItem('qz_muted','0')}
  if(v===0&&!isMuted){isMuted=true;localStorage.setItem('qz_muted','1')}
  localStorage.setItem('qz_vol',v);
  applyVol();
  const sl=$('#volSlider'),vv=$('#volVal'),btn=$('#volBtn');
  if(sl)sl.value=v;
  if(vv)vv.textContent=volLabel();
  if(btn){
    btn.innerHTML=`<i class="fa ${volIcon()}"></i>`;
    btn.classList.toggle('muted',isMuted||v===0);
  }
}
function toggleMute(){
  isMuted=!isMuted;
  localStorage.setItem('qz_muted',isMuted?'1':'0');
  applyVol();
  const vv=$('#volVal'),btn=$('#volBtn');
  if(vv)vv.textContent=volLabel();
  if(btn){
    btn.innerHTML=`<i class="fa ${volIcon()}"></i>`;
    btn.classList.toggle('muted',isMuted);
  }
  if(isMuted&&myVol===0)setVol(50);
}
function updateNowPlaying(){
  if(!RM?.pl?.getVideoData)return;
  try{
    const vd=RM.pl.getVideoData();
    if(vd&&vd.title){
      const st=$('#rstat');
      if(st)st.innerHTML=`${srcPill(RM.doc.srcType)}<i class="fa fa-music mr-1"></i>${esc(vd.title.slice(0,50))}${vd.title.length>50?'…':''}`;
    }
  }catch(e){}
}
function pub(p,t){
  if(!RM?.pl?.getCurrentTime)return;
  const now=Date.now();
  if(!p && RM._lastPausePub && now-RM._lastPausePub<500)return;
  if(!p) RM._lastPausePub=now;
  RM.last={p,t,at:now};
  const curRev=(RM.doc?.pb?.rev||0)+1;
  rUpd(RM.id,{pb:{p,t,rev:curRev,ts:now}}).catch(()=>{});
}
function applyPb(pb,force){
  if(!RM?.rdy||isHost()||!pb)return;
  const pl=RM.pl;
  if(!force&&RM.rev==pb.rev)return;
  RM.rev=pb.rev;
  const cur=pl.getCurrentTime?.()||0;
  const live=pl.getVideoData?.().isLive;
  const since=pb.p?Math.min((Date.now()-(pb.ts||Date.now()))/1000,5):0;
  const target=pb.t+since+(pb.p?0.3:0);
  if(!live){
    const diff=Math.abs(cur-target);
    if(diff>2) pl.seekTo(target,true);
  }
  if(pb.p && pl.getPlayerState()!==1) pl.playVideo();
  if(!pb.p && pl.getPlayerState()===1) pl.pauseVideo();
  applyVol();
  const sb=$('#syncbar');
  if(sb){sb.style.width='100%';setTimeout(()=>sb.style.width='0%',400)}
}
function roomTick(){
  if(!RM)return;RM.c=(RM.c||0)+1;
  if(RM.c%20==1)rUpd(RM.id,{['m.'+me.id]:{n:me.name,ts:Date.now()}}).catch(()=>{});
  if(!RM.rdy||!isHost()||!RM.pl?.getCurrentTime)return;
  const st=RM.pl.getPlayerState();
  const cur=RM.pl.getCurrentTime();
  if(st!==1 && st!==2) return;
  if(typeof cur!=='number' || !isFinite(cur)) return;
  if(RM.c%5==0) pub(st===1, cur);
}

// ===== Chat =====
function rSend(e){
  e.preventDefault();const i=$('#rin'),t=i.value.trim().slice(0,300);
  if(!t||!RM||Date.now()-(RM.ls||0)<700)return false;
  RM.ls=Date.now();i.value='';
  rUpd(RM.id,{['t.'+me.id]:0},{chat:{u:me.id,n:me.name,t,ts:Date.now()}}).catch(()=>toast('Không gửi được','err'));
  return false;
}
function rTyping(){
  if(!RM||Date.now()-(RM.lt||0)<1000)return;RM.lt=Date.now();
  rUpd(RM.id,{['t.'+me.id]:Date.now()}).catch(()=>{});
}
setInterval(()=>{
  if(!RM?.doc)return;
  const t=RM.doc.t||{},now=Date.now(),arr=[];
  for(const[k,v]of Object.entries(t)){if(k!=me.id&&v&&now-v<4000){const m=RM.doc.m?.[k];if(m)arr.push(m.n.split(' ')[0])}}
  const el=$('#rtyping');if(el)el.textContent=arr.length?arr.slice(0,3).join(', ')+(arr.length>3?` +${arr.length-3}`:'')+' đang nhập...':'';
},1500);

function rQAdd(){
  const src=ytParse($('#qin').value);if(!src)return toast('Link không hợp lệ','err');

  $('#qin').value='';
}
function rQDel(i){const q=[...(RM.doc.queue||[])];q.splice(i,1);rUpd(RM.id,{queue:q})}

// ===== Phần thi (CẬP NHẬT GIAO DIỆN MOBILE) =====
async function start(id,opt){if(useFB){try{const d=await fdb.collection('users').doc(me.id).get();if(d.exists)me.role=d.data().role}catch(e){}}if(me.role=='banned'){toast('Tài khoản đã bị khóa','err');return logout()}const q=S.quizzes.find(x=>x.id==id);if(!opt&&q.mode=='multi')return modeSel(id);const o=opt||{pm:0,sq:!!q.shuffle,so:!!q.shuffle};let qs=q.qs.map((x,i)=>({...x,i,num:x.num||(i+1),ord:[0,1,2,3]}));
 if(o.so)qs.forEach(x=>x.ord=sh(x.ord));if(o.sq)qs=sh(qs);
 HL={};ex={q,qs,pm:!!o.pm,rv:{},cur:0,ans:{},flag:{},tabs:0,t0:Date.now(),last:0};view='exam';render();clearInterval(tm);tm=setInterval(tick,1000)}

 const card=(k,ic,t,d)=>`<button class="opt ${sm.pm==k?'sel':''}" onclick="modeSel('${id}',{pm:${k}})"><div class="flex items-start gap-3"><i class="fa ${ic} mt-1 text-[color:var(--ac-t)]"></i><div><div class="font-semibold">${t}</div><div class="text-sm text-slate-500">${d}</div></div></div></button>`;
 modal(`<h3 class="text-xl font-semibold mb-1">${esc(q.title)}</h3><p class="text-sm text-slate-500 mb-3">${q.qs.length} câu · ${q.dur} phút</p>${card(0,'fa-stopwatch','Thi thử','Làm như thi thật: có tính giờ, nộp bài mới xem đáp án và được tính vào bảng xếp hạng.')}${card(1,'fa-lightbulb','Luyện tập','Bấm vào câu nào hiện đáp án và lời giải của câu đó. Không tính giờ, không tính xếp hạng.')}<p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mt-4 mb-2">Đảo thứ tự</p><div class="seg" style="flex-wrap:wrap">${['Không đảo','Đảo câu hỏi','Đảo đáp án','Đảo cả hai'].map((l,i)=>`<button class="${sm.sh==i?'on':''}" onclick="modeSel('${id}',{sh:${i}})">${l}</button>`).join('')}</div><button class="btn w-full mt-5" onclick="modal('');start('${id}',{pm:sm.pm,sq:sm.sh==1||sm.sh==3,so:sm.sh==2||sm.sh==3})">Bắt đầu làm bài</button>`)}
const el=()=>Math.floor((Date.now()-ex.t0)/1000);
const left=()=>Math.max(0,ex.q.dur*60-Math.floor((Date.now()-ex.t0)/1000));
function tick(){if(!ex)return;if(!ex.pm&&!left()){toast('Hết giờ, tự nộp bài','err');return submit()}const e=$('#tm');if(e)e.textContent=fmt(ex.pm?el():left())}

const palH=()=>ex.qs.map((x,k)=>{
  const a=ex.ans[x.i],d=Array.isArray(a)?a.some(v=>v!=null):(a!==undefined&&a!=='');
  let cls='';
  if(k==ex.cur) cls='cur';

function examH(){
  const{q,qs,cur}=ex,x=qs[cur],a=ex.ans[x.i],n=qs.filter(y=>{const v=ex.ans[y.i];return Array.isArray(v)?v.some(z=>z!=null):(v!==undefined&&v!=='')}).length;

  else if(x.type=='tf')body=`<div class="mt-3 rounded-xl border border-[color:var(--bd)] overflow-hidden"><div class="hidden sm:grid grid-cols-[1fr_auto] gap-4 px-4 py-2 bg-[color:var(--mu)] border-b border-[color:var(--bd)] text-xs font-semibold uppercase tracking-wider text-slate-500"><span>Nhận định</span><span class="w-[9.5rem] text-center">Chọn đáp án</span></div><div class="divide-y divide-[color:var(--bd)]">`+x.ord.filter(o=>o<x.opts.length).map((o,p)=>`<div class="grid sm:grid-cols-[1fr_auto] gap-x-4 gap-y-3 items-center px-4 py-3.5"><div><b class="text-[color:var(--ac-t)]">${'abcd'[p]})</b> ${rtf(x.opts[o])}</div><div class="flex gap-2 sm:w-[9.5rem]">${[true,false].map(v=>`<button class="flex-1 py-1.5 rounded-lg border font-medium ${rv?(x.ans[o]===v?'ok':a?.[o]===v?'no':'border-slate-300'):(a?.[o]===v?'sel':'border-slate-300')}" onclick="(ex.ans[${x.i}]=ex.ans[${x.i}]||[null,null,null,null])[${o}]=${v};render()">${v?'Đúng':'Sai'}</button>`).join('')}</div></div>`).join('')+`</div></div>`;

  return `<div class="exam-layout">

const cheat=()=>{if(!ex||ex.pm||!ex.q.anti||Date.now()-ex.last<1500)return;ex.last=Date.now();ex.tabs++;toast(`Cảnh báo: bạn rời màn hình (lần ${ex.tabs})`,'err');const e=$('#tb');if(e)e.textContent=ex.tabs};
document.addEventListener('visibilitychange',()=>document.hidden&&cheat());addEventListener('blur',cheat);
function grade(q,ans){let pts=0,ok=0;const per=10/q.qs.length;
 q.qs.forEach((x,i)=>{const a=ans[i];let f=0,full=0;
  if(x.type=='mc'){f=(x.ans&&a==='ABCD'.indexOf(x.ans))?1:0;full=f}
  else if(x.type=='tf'){const k=x.ans.filter((v,j)=>a?.[j]===v).length;f=[0,.1,.25,.5,1][k]||0;full=k==x.ans.length?1:0}
  else{f=(a&&x.ans.some(v=>nz(v)==nz(a)))?1:0;full=f}
  pts+=f*per;ok+=full});return{base:+pts.toFixed(2),ok}}
async function submit(){if(!ex)return;clearInterval(tm);const{q}=ex,t=ex.pm?Math.round((Date.now()-ex.t0)/1000):Math.min(q.dur*60,Math.round((Date.now()-ex.t0)/1000)),g=grade(q,ex.ans),sp=+((g.base/10)*Math.max(0,1-t/(q.dur*60))*2).toFixed(2);

function toRaw(qs){
  let out='',lastG='';
  qs.forEach((x,i)=>{
    const g=x.group||'';
    if(g!==lastG){
      if(lastG) out+=(out?'\n':'')+`[/HẾT ĐOẠN VĂN]\n`;
      if(g) out+=(out?'\n':'')+`[ĐOẠN VĂN]\n${g}\n[/ĐOẠN VĂN]\n`; 
      lastG=g;
    }
    out+=(out?'\n':'')+`Câu ${x.num||(i+1)}: ${x.text}\n`;
    if(x.type=='mc')x.opts.forEach((o,k)=>out+=`${'ABCD'[k]==x.ans?'*':''}${'ABCD'[k]}. ${o}\n`);
    else if(x.type=='tf')x.opts.forEach((o,k)=>out+=`${x.ans[k]?'*':''}${'abcd'[k]}) ${o}\n`);
    else if(x.type=='sa')out+=`*ĐA: ${x.ans.join(' | ')}\n`;
    if(x.exp)out+=`*GT: ${x.exp}\n`;
  });
  if(lastG) out+=(out?'\n':'')+`[/HẾT ĐOẠN VĂN]\n`;
  return out.trim();
}

  <div class="grid gap-3 md:grid-cols-4 mt-3 pb-1"><input id="qt" class="inp md:col-span-2" placeholder="Tên đề thi" value="${esc(q?.title||'')}"><input id="qd" type="number" class="inp" value="${q?.dur||45}" min="1" title="Thời gian (phút)"><select id="qc" class="inp"><option value="">Tất cả các lớp</option>${clsOpts(q?.classId)}</select>
  <select id="qm" class="inp"><option value="multi" ${q?.mode=='once'?'':'selected'}>Luyện tập</option><option value="once" ${q?.mode=='once'?'selected':''}>Kiểm tra (1 lần)</option></select>
  <div class="text-sm md:col-span-3 flex flex-wrap gap-x-5 gap-y-1 items-center"><label><input type="checkbox" id="q1" ${q?.shuffle?'checked':''}> Đảo câu hỏi và đáp án</label><label><input type="checkbox" id="q2" ${q?q.anti?'checked':'':'checked'}> Chống gian lận</label><label><input type="checkbox" id="q3" ${q?q.show?'checked':'':'checked'}> Cho xem đáp án</label></div></div></details>
 <div class="seg lg:hidden mx-3 mt-3"><button class="on" data-k="code" onclick="edTab('code')">Soạn mã</button><button data-k="pv" onclick="edTab('pv')">Xem trước</button></div>
 <div class="flex-1 min-h-0 grid lg:grid-cols-2 grid-rows-[minmax(0,1fr)] mt-3 lg:mt-0">
  <section id="edR" class="min-h-0 overflow-auto p-4"><div id="pv"></div></section>
  <section id="edL" class="min-h-0 flex-col lg:border-l border-[color:var(--bd)]"><div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-slate-500 border-b border-[color:var(--bd)]">Mã đề</div><textarea id="qx" spellcheck="false" class="flex-1 min-h-0 w-full p-4 font-mono text-[13px] leading-6 outline-none resize-none" oninput="edPrev()"></textarea></section></div></div>`;
 edInit=raw;$('#qx').value=raw;edPrev(1)}
const edTab=t=>{$('.ed').dataset.t=t;document.querySelectorAll('.ed .seg button').forEach(b=>b.classList.toggle('on',b.dataset.k==t));if(t=='pv')edPrev(1)};
function closeEd(){if($('#qx').value!==edInit&&!confirm('Bỏ thay đổi chưa lưu?'))return;$('#modal').innerHTML=''}
const skel=()=>{if($('#qx').value.trim()&&!confirm('Thay bằng khung mẫu?'))return;$('#qx').value=ED_SKEL;edPrev(1)};
function readTxt(el){const f=el.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#qx').value=r.result;edPrev(1)};r.readAsText(f)}}
function edPrev(now){clearTimeout(edT);const run=()=>{const v=$('#qx').value;EP=parse(v,1);const h=(v.match(/^\s*Câu\s*\d+\s*[:.]/gim)||[]).length,r=$('#edR'),y=r.scrollTop;
  $('#pv').innerHTML=edH();r.scrollTop=y;math();$('#edinfo').innerHTML=`${EP.length} câu`+(h>EP.length?` <span style="color:var(--wa-t)">· ${h-EP.length} chưa nhận diện</span>`:'')};now?run():edT=setTimeout(run,180)}
function edH(){if(!EP.length)return `<div class="text-center py-16 text-slate-500"><i class="fa fa-wand-magic-sparkles text-2xl mb-3"></i><p>Bản xem trước khi soạn đề.</p><button class="btn b2 mt-3" onclick="skel()">Chèn khung mẫu</button></div>`;
 return `<p class="text-xs text-slate-500 mb-3"><i class="fa fa-hand-pointer mr-1"></i>Bấm vào đáp án để đặt đáp án đúng.</p>`+EP.map((x,i)=>{let b='';
  if(x.type=='mc')b=(x.ans?'':`<p class="text-xs mb-1" style="color:var(--wa-t)">Chưa chọn đáp án đúng.</p>`)+x.opts.map((o,k)=>`<button class="opt ${'ABCD'[k]==x.ans?'ok':''}" onclick="edMC(${i},${k})"><b>${'ABCD'[k]}.</b> ${rtf(o)}${'ABCD'[k]==x.ans?'<i class="fa fa-circle-check float-right mt-1"></i>':''}</button>`).join('');
  else if(x.type=='tf')b=`<div class="rounded-xl border border-[color:var(--bd)] divide-y divide-[color:var(--bd)] overflow-hidden mt-2">${x.opts.map((o,k)=>`<div class="grid sm:grid-cols-[1fr_auto] gap-x-4 gap-y-2 items-center px-4 py-3"><div><b class="text-[color:var(--ac-t)]">${'abcd'[k]})</b> ${rtf(o)}</div><div class="flex gap-2 sm:w-[9.5rem]">${[true,false].map(v=>`<button class="flex-1 py-1.5 rounded-lg border font-medium ${x.ans[k]===v?'ok':'border-slate-300'}" onclick="edTF(${i},${k},${v})">${v?'Đúng':'Sai'}</button>`).join('')}</div></div>`).join('')}</div>`;
  else b=`<input class="inp mt-2" value="${esc(x.ans.join(' | '))}" onchange="edSA(${i},this.value)" placeholder="Đáp án, nhiều cách cách nhau bởi |">`;
  return `<div class="card mb-3" style="padding:1rem"><div class="flex items-center gap-2 mb-2"><b class="text-[color:var(--ac-t)]">Câu ${esc(x.num)}</b><span class="badge">${{mc:'Trắc nghiệm',tf:'Đúng/Sai',sa:'Trả lời ngắn'}[x.type]}</span></div>${x.group&&x.group!=EP[i-1]?.group?`<div class="mb-2 p-3 rounded-xl text-sm leading-relaxed whitespace-pre-line" style="background:var(--mu)">${rtf(x.group,x.num)}</div>`:''}<p class="whitespace-pre-line font-medium mb-1">${rtf(x.text)}</p>${b}${x.exp?`<div class="mt-2 text-xs p-2.5 rounded-lg whitespace-pre-line" style="background:var(--mu)"><b>Lời giải:</b> ${rtf(x.exp)}</div>`:''}</div>`}).join('')}
function edTop(ta,n,lh){const cs=getComputedStyle(ta),m=document.createElement('div');m.style.cssText=`position:absolute;visibility:hidden;left:-9999px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;font:${cs.font};line-height:${cs.lineHeight};padding:${cs.padding};width:${ta.clientWidth}px`;m.textContent=ta.value.split('\n').slice(0,n).join('\n')+(n?'\n':'')+'x';document.body.append(m);const t=m.scrollHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-lh;m.remove();return Math.max(0,t)}
function edApply(ch,ln){const ta=$('#qx'),L=ta.value.replace(/\r/g,'').split('\n');ch.forEach(([n,f])=>{if(n!=null)L[n]=f(L[n])});const y=ta.scrollTop;ta.value=L.join('\n');ta.scrollTop=y;ta.scrollLeft=0;
 const lh=parseFloat(getComputedStyle(ta).lineHeight)||22,top=edTop(ta,ln??ch[0][0],lh);if(top<ta.scrollTop||top>ta.scrollTop+ta.clientHeight-2*lh)ta.scrollTop=Math.max(0,top-ta.clientHeight/2);edPrev(1)}
const edMC=(i,k)=>edApply(EP[i]._L.mc.map((n,j)=>[n,l=>l.replace(/^(\s*)\*?\s*(?=[A-D]\.)/,j==k?'$1*':'$1')]),EP[i]._L.mc[k]);
const edTF=(i,k,v)=>edApply([[EP[i]._L.tf[k],l=>l.replace(/^(\s*)\*?\s*(?=[a-d]\))/,v?'$1*':'$1')]]);
const edSA=(i,v)=>edApply([[EP[i]._L.sa,l=>l.replace(/^(\s*\*\s*(?:ĐA|KQ)\s*:\s*).*$/i,(m,a)=>a+v.trim())]]);
async function saveQ(){const qs=parse($('#qx').value),t=$('#qt').value.trim();if(!t||!qs.length)return toast('Cần tên đề và ít nhất 1 câu','err');
 const bad=qs.filter(x=>x.type=='mc'&&!x.ans).length;if(bad&&!confirm(`${bad} câu chưa có đáp án. Vẫn lưu?`))return;
 const old=editId&&S.quizzes.find(x=>x.id==editId);if(editId&&!canEdit(old))return toast('Không có quyền','err');
 await save('quizzes',{id:editId||uid(),ownerId:old?.ownerId||me.id,title:t,dur:+$('#qd').value||45,classId:$('#qc').value,mode:$('#qm').value,shuffle:$('#q1').checked,anti:$('#q2').checked,show:$('#q3').checked,qs});$('#modal').innerHTML='';toast(`Đã lưu (${qs.length} câu)`);render()}
let cmT='cls',cmQ='',cmC='';
const ROLE={admin:'Quản trị',teacher:'Giáo viên',student:'Học sinh',banned:'Bị khóa'};
const clsBody=()=>`<div class="flex gap-2 mb-3"><input id="nc" class="inp" placeholder="Tên lớp mới"><button class="btn bg" onclick="addC()">Thêm</button></div>${S.classes.map(c=>{const m=S.users.filter(u=>u.classId==c.id);return `<div class="card mb-2" style="padding:1rem"><div class="flex gap-2 items-center"><b class="mr-auto">${esc(c.name)} <span class="text-slate-500 text-sm font-normal">(${m.length} thành viên)</span></b><button class="btn b2" onclick="renC('${c.id}')"><i class="fa fa-pen"></i></button><button class="btn br" onclick="delC('${c.id}')"><i class="fa fa-trash"></i></button></div><p class="text-sm text-slate-500 mt-1">${m.map(u=>esc(u.name)).join(', ')||'Chưa có'}</p></div>`}).join('')}`;
function usrRows(){const q=cmQ.trim().toLowerCase(),L=S.users.filter(u=>(!cmC||u.classId==cmC)&&(!q||(u.name+' '+u.username+' '+(u.email||'')).toLowerCase().includes(q)));
 return L.map(u=>{const self=u.id==me.id,bn=u.role=='banned';return `<div class="flex flex-wrap items-center gap-3 py-3 border-b border-[color:var(--bd)] last:border-0"><img src="${av(u)}" class="w-9 h-9 rounded-full object-cover ${bn?'opacity-50':''}"><div class="flex-1 min-w-[150px]"><div class="font-medium">${esc(u.name)}${self?' <span class="badge">Bạn</span>':''}${bn?' <span class="badge warn">Bị khóa</span>':''}</div><div class="text-xs text-slate-500">${esc(u.email||u.username)} · ${esc(cn(u.classId))}</div></div><select class="inp" style="width:auto;padding:.4rem .7rem" ${self?'disabled':''} onchange="setRole('${u.id}',this.value)">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${u.role==k?'selected':''}>${l}</option>`).join('')}</select><button class="btn b2" ${self?'disabled':''} onclick="setRole('${u.id}','${bn?(u.prevRole||'student'):'banned'}')">${bn?'<i class="fa fa-lock-open mr-1.5"></i>Mở khóa':'<i class="fa fa-lock mr-1.5"></i>Khóa'}</button></div>`}).join('')||'<p class="text-center text-slate-500 py-8">Không có tài khoản.</p>'}
const usrBody=()=>`<div class="flex flex-wrap gap-2 mb-2"><input class="inp flex-1" style="min-width:160px" placeholder="Tìm..." value="${esc(cmQ)}" oninput="cmQ=this.value;$('#ul').innerHTML=usrRows()"><select class="inp" style="width:auto" onchange="cmC=this.value;$('#ul').innerHTML=usrRows()"><option value="">Tất cả lớp</option>${clsOpts(cmC)}</select></div><p class="text-xs text-slate-500 mb-1">Tài khoản bị khóa không thể đăng nhập.</p><div id="ul" class="max-h-[55vh] overflow-auto">${usrRows()}</div>`;
async function setRole(id,r){const u=S.users.find(x=>x.id==id);if(!u||u.id==me.id)return;if(r=='banned'&&u.role!='banned')u.prevRole=u.role;u.role=r;await save('users',u);toast(`${u.name}: ${ROLE[r]}`);$('#ul').innerHTML=usrRows()}
function clsMgr(t){if(t)cmT=t;modal(`<h3 class="text-xl font-semibold mb-3">Quản lý lớp</h3><div class="seg mb-4"><button class="${cmT=='cls'?'on':''}" onclick="clsMgr('cls')">Lớp học</button><button class="${cmT=='usr'?'on':''}" onclick="clsMgr('usr')">Tài khoản (${S.users.length})</button></div>${cmT=='cls'?clsBody():usrBody()}`)}
async function addC(){const n=$('#nc').value.trim();if(!n)return;await save('classes',{id:uid(),name:n});toast('Đã thêm');clsMgr()}
async function renC(id){const c=S.classes.find(x=>x.id==id),n=prompt('Tên mới:',c.name);if(n?.trim()){c.name=n.trim();await save('classes',c);toast('Đã đổi');clsMgr();render()}}
async function delC(id){if(!confirm('Xóa lớp?'))return;for(const u of S.users.filter(u=>u.classId==id)){u.classId='';await save('users',u)}await del('classes',id);toast('Đã xóa');clsMgr();render()}
const AVS=['Felix','Aneka','Luna','Milo','Zoe','Leo','Mia','Max'];
function profile(){newAv=null;modal(`<h3 class="text-xl font-bold mb-3">Hồ sơ</h3><div class="flex items-center gap-3 mb-3 flex-wrap"><img id="pa" src="${av(me)}" class="w-20 h-20 rounded-full border-2 border-[color:var(--ac)] object-cover"><div><div class="flex flex-wrap gap-1">${AVS.map(s=>{const u=`https://api.dicebear.com/7.x/adventurer/svg?seed=${s}`;return `<img src="${u}" class="w-10 h-10 rounded-full cursor-pointer hover:ring-2 ring-[color:var(--ok)]" onclick="setAv('${u}')">`}).join('')}</div><label class="btn b2 inline-block mt-2 cursor-pointer text-sm"><i class="fa fa-upload"></i> Tải ảnh<input type="file" accept="image/*" hidden onchange="upAv(this)"></label></div></div><div class="grid gap-2"><input id="pn" class="inp" value="${esc(me.name)}" placeholder="Họ và tên"><input id="pb" class="inp" value="${esc(me.bio)}" placeholder="Châm ngôn"><select id="pc" class="inp">${clsOpts(me.classId)}</select><input id="pp" type="password" class="inp" placeholder="Mật khẩu mới"></div><button class="btn bg mt-3" onclick="saveP()">Lưu</button>`)}
const setAv=u=>{newAv=u;$('#pa').src=u};
function upAv(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=150;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,150,150);setAv(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
async function saveP(){const n=$('#pn').value.trim();if(!n)return toast('Họ tên không trống','err');Object.assign(me,{name:n,bio:$('#pb').value.trim(),classId:$('#pc').value});
 if(newAv)me.avatar=newAv;if($('#pp').value)me.pass=$('#pp').value;await save('users',me);modal('');toast('Đã cập nhật');render()}
(async()=>{try{await load()}catch(e){useFB=false;toast('Không kết nối Firebase, dùng localStorage','err');await load()}
 await seed();me=S.users.find(u=>u.id==localStorage.getItem('qz_me'))||null;if(me?.role=='banned')me=null;render()})();
</script></body></html>
