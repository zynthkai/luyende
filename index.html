// ===== Parser đề thi chuẩn cấu trúc mới (Hỗ trợ [ĐOẠN VĂN], Cloze Test, Sắp xếp, Gạch chân) =====
function parse(t){
  const qs=[];let cq=null,cg='',ig=false,md='text',m;
  t.replace(/\r/g,'').split('\n').forEach(ln=>{
    const tr=ln.trim();
    if(/^\[ĐOẠN VĂN\]$/i.test(tr)){ig=true;cg='';return}
    if(/^\[\/ĐOẠN VĂN\]$/i.test(tr)){ig=false;return}
    if(ig){cg+=(cg?'\n':'')+tr;return}
    if(m=tr.match(/^\s*Câu\s*(\d+)\s*[:.]\s*(.*)$/i)){
      if(cq)qs.push(cq);
      const qNum=m[1],rawTxt=m[2].replace(/\s*\|\s*/g,'\n').trim();
      cq={num:qNum,text:rawTxt,mc:[],tf:[],sa:null,exp:'',group:cg};md='text';
    }else if(cq){
      if(m=tr.match(/^\s*(\*)?\s*([A-D])\.\s*(.*)$/)){cq.mc.push({t:m[3],c:!!m[1]});md='mc'}
      else if(m=tr.match(/^\s*(\*)?\s*([a-d])\)\s*(.*)$/)){cq.tf.push({t:m[3],c:!!m[1]});md='tf'}
      else if(m=tr.match(/^\s*\*\s*(?:ĐA|KQ)\s*:\s*(.*)$/i)){cq.sa=m[1].split('|').map(s=>s.trim()).filter(Boolean);md='sa'}
      else if(m=tr.match(/^\s*\*\s*GT\s*:\s*(.*)$/i)){cq.exp=m[1];md='exp'}
      else if(tr){
        if(md=='text')cq.text+=(cq.text?'\n':'')+tr.replace(/\s*\|\s*/g,'\n');
        else if(md=='exp')cq.exp+='\n'+tr;
        else if(md=='mc'||md=='tf')cq[md].at(-1).t+=' '+tr;
      }
    }
  });
  if(cq)qs.push(cq);
  return qs.map((o,idx)=>{
    const num=o.num||(idx+1);
    const txt=o.text||`Chọn phương án đúng nhất để điền vào chỗ trống (${num}) trong đoạn văn:`;
    const x={num,text:txt,exp:o.exp,group:o.group||''};
    if(o.mc.length>1)return{...x,type:'mc',opts:o.mc.map(a=>a.t),ans:'ABCD'[o.mc.findIndex(a=>a.c)]||''};
    if(o.tf.length>1)return{...x,type:'tf',opts:o.tf.map(a=>a.t),ans:o.tf.map(a=>a.c)};
    if(o.sa)return{...x,type:'sa',ans:o.sa};return null
  }).filter(Boolean);
}

 const tab=(k,l,c,cl)=>`<button onclick="rvf='${k}';render()" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold border transition ${rvf==k?cl:'bg-white border-[color:var(--bd)] text-slate-600 hover:border-[color:var(--ac)]'}">${l} <span class="opacity-70">${c}</span></button>`;
 const BD={ok:['Đúng','bg-[color:var(--ok-s)] text-[color:var(--ok-t)]','fa-circle-check'],bad:['Sai','bg-[color:var(--er-s)] text-[color:var(--er-t)]','fa-circle-xmark'],blank:['Chưa trả lời','bg-[color:var(--mu)] text-slate-600','fa-circle-minus']};
 const chips=st.map((s,i)=>`<button title="Câu ${i+1}" onclick="goQ(${i})" class="w-8 h-8 rounded-lg text-xs font-bold border ${s.s=='ok'?'bg-[color:var(--ok-s)] border-[color:var(--ok-b)] text-[color:var(--ok-t)]':'bg-[color:var(--er-s)] border-[color:var(--er-b)] text-[color:var(--er-t)]'}">${i+1}</button>`).join('');
 const cards=q.qs.map((x,i)=>{const s=st[i];if(rvf=='ok'&&s.s!='ok'||rvf=='bad'&&s.s=='ok')return '';
  const a=r.answers[i],qNum=x.num||(i+1),qTxt=x.text||`Chọn phương án đúng nhất để điền vào chỗ trống (${qNum}) trong đoạn văn:`,bd=BD[s.s];let b='';
  if(x.type=='mc')b=x.opts.map((o,k)=>`<div class="opt ${'ABCD'[k]==x.ans?'ok':a===k?'no':''}"><b>${'ABCD'[k]}.</b> ${rtf(o)}</div>`).join('');
  else if(x.type=='tf')b=x.opts.map((o,k)=>`<div class="opt ${a?.[k]===x.ans[k]?'ok':'no'}"><b>${'abcd'[k]})</b> ${rtf(o)}<br><span class="text-sm">Đáp án: <b>${x.ans[k]?'Đúng':'Sai'}</b>. Bạn chọn: ${a?.[k]==null?'chưa chọn':a[k]?'Đúng':'Sai'}</span></div>`).join('');
  else b=`<div class="opt ${s.s=='ok'?'ok':'no'}">Bạn trả lời: ${esc(a||'(trống)')}</div><div class="opt ok">Đáp án: ${esc(x.ans.join(' | '))}</div>`;
  return `<div id="rq${i}" class="card mb-4 scroll-mt-20"><div class="flex flex-wrap items-center gap-2 mb-2"><b class="text-[color:var(--ac-t)]">Câu ${i+1}</b><span class="text-xs font-semibold px-2 py-0.5 rounded-full ${bd[1]}"><i class="fa ${bd[2]}"></i> ${bd[0]}${s.part?` · ${s.part}`:''}</span></div>${x.group?`<div class="mb-2 p-3 bg-[color:var(--mu)] border border-[color:var(--bd)] rounded-xl whitespace-pre-line text-sm leading-relaxed">${rtf(x.group,qNum)}</div>`:''}<p class="whitespace-pre-line my-2 font-semibold">${rtf(qTxt)}</p>${b}${x.exp?`<div class="mt-3 p-3 rounded-xl bg-[color:var(--mu)] border border-[color:var(--bd)] whitespace-pre-line"><b>Lời giải:</b> ${rtf(x.exp)}</div>`:''}</div>`}).join('');
 return `<div class="flex flex-wrap items-end justify-between gap-3 mb-3"><div><p class="text-xs uppercase tracking-widest text-[color:var(--tx2)] font-bold mb-1">Xem lại bài làm</p><h2 class="text-2xl font-bold">${esc(q.title)}</h2><p class="text-sm text-slate-500 mt-1">${dtf(r.ts)}</p></div><div class="text-right"><div class="text-2xl font-extrabold text-[color:var(--ac-t)]">${r.base}/10</div><div class="text-xs text-slate-500">Điểm gốc</div></div></div>
 <div class="card mb-4"><div class="h-2 rounded-full bg-[color:var(--er-s)] overflow-hidden mb-3"><div class="h-full bg-[color:var(--ok-b)]" style="width:${nOk/st.length*100}%"></div></div><div class="flex flex-wrap gap-2 mb-3">${tab('all','Tất cả',st.length,'bg-[color:var(--ac)] border-[color:var(--ac)] text-white')}${tab('ok','Đúng',nOk,'bg-[color:var(--ok-s)] border-[color:var(--ok-b)] text-[color:var(--ok-t)]')}${tab('bad','Sai',nBad,'bg-[color:var(--er-s)] border-[color:var(--er-b)] text-[color:var(--er-t)]')}</div><div class="flex flex-wrap gap-1.5">${chips}</div></div>
 ${cards||`<div class="card text-center py-10 text-slate-500">${rvf=='bad'?'Bạn không sai câu nào.':'Không có câu nào.'}</div>`}
 <div class="flex gap-2 flex-wrap"><button class="btn b2" onclick="hist('${r.quizId}')">Lịch sử đề này</button><button class="btn b2" onclick="go('home')">Về trang chủ</button></div>`}

       <span><i class="fa fa-circle-check text-[color:var(--ac-t)] mr-1"></i>Đúng <b>${r.ok??0}/${r.total??0}</b></span>

       <span><i class="fa fa-arrow-right-arrow-left mr-1"></i>Chuyển tab: ${r.tabs||0}</span>
      </div>

    </div>
    <div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-[color:var(--bd)]">
     ${can?`<button class="btn b2" onclick="review('${r.id}')"><i class="fa fa-book-open mr-1"></i> Xem lại bài</button>${(r.total-r.ok)>0?`<button class="btn b2" onclick="review('${r.id}','bad')"><i class="fa fa-circle-xmark mr-1 text-[color:var(--er-t)]"></i> Xem câu sai (${r.total-r.ok})</button>`:''}`:`<span class="text-xs text-slate-500 self-center">Đề này không cho xem lại đáp án.</span>`}

   </article>`}).join('')}</div>`:`<div class="card text-center py-12"><div class="w-14 h-14 mx-auto rounded-2xl bg-[color:var(--mu)] text-[color:var(--tx2)] flex items-center justify-center text-xl mb-3"><i class="fa fa-clock-rotate-left"></i></div><h3 class="font-bold text-lg">Chưa có lượt làm nào cho đề này</h3><p class="text-sm text-slate-500 mt-1">Sau khi nộp bài, kết quả sẽ xuất hiện ở đây.</p></div>`}

const lbRows=()=>{const b={};S.results.filter(r=>r.quizId==lb.q&&(!lb.c||r.classId==lb.c)).forEach(r=>{if(!b[r.userId]||r.rank>b[r.userId].rank)b[r.userId]=r});return Object.values(b).sort((a,c)=>c.rank-a.rank)};
function lbH(){if(!lb.q)lb.q=S.quizzes[0]?.id||'';const rows=lbRows();
 return `<div class="card"><div class="flex flex-wrap gap-2 mb-3"><select class="inp" style="width:auto" onchange="lb.q=this.value;render()">${S.quizzes.map(q=>`<option value="${q.id}" ${q.id==lb.q?'selected':''}>${esc(q.title)}</option>`).join('')}</select><select class="inp" style="width:auto" onchange="lb.c=this.value;render()"><option value="">Tất cả lớp</option>${clsOpts(lb.c)}</select>${me.role=='admin'?`<button class="btn bg ml-auto" onclick="csv()"><i class="fa fa-file-excel"></i> Xuất Bảng Điểm (.CSV / Excel)</button>`:''}</div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-slate-500"><tr><th class="p-2">Hạng</th><th>Học sinh</th><th>Điểm xếp hạng</th><th>Điểm gốc</th><th>Câu đúng</th><th>Thời gian</th><th>Chuyển tab</th></tr></thead><tbody>${rows.map((r,i)=>{const u=S.users.find(x=>x.id==r.userId)||{username:r.userId};return `<tr class="border-t border-slate-200"><td class="p-2 text-xl">${['🥇','🥈','🥉'][i]||i+1}</td><td><div class="flex items-center gap-2"><img src="${av(u)}" class="w-8 h-8 rounded-full object-cover"><div><b>${esc(r.name)}</b><div class="text-xs text-slate-500">${esc(cn(r.classId))}</div></div></div></td><td class="text-lg font-extrabold text-[color:var(--ac-t)]">${r.rank}</td><td>${r.base}</td><td>${r.ok}/${r.total}</td><td>${fmt(r.time)}</td><td>${r.tabs}</td></tr>`}).join('')||'<tr><td colspan="7" class="p-4 text-slate-500">Chưa có kết quả nào.</td></tr>'}</tbody></table></div></div>`}
function csv(){const q=S.quizzes.find(x=>x.id==lb.q),h=['Hạng','Họ tên','Tài khoản','Lớp','Điểm xếp hạng','Điểm gốc','Thưởng tốc độ','Số câu đúng','Thời gian','Chuyển tab'];
 const s=[h,...lbRows().map((r,i)=>[i+1,r.name,S.users.find(u=>u.id==r.userId)?.username,cn(r.classId),r.rank,r.base,r.speed,r.ok,fmt(r.time),r.tabs])].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));l.download=`bang-diem-${q?.title||'de'}.csv`;l.click()}
// ===== Admin: tạo / sửa đề =====
function toRaw(qs){
  let out='',lastG='';
  qs.forEach((x,i)=>{
    const g=x.group||'';
    if(g!==lastG){out+=(out?'\n':'')+`[ĐOẠN VĂN]\n${g}\n[/ĐOẠN VĂN]\n`;lastG=g}
    out+=(out?'\n':'')+`Câu ${x.num||(i+1)}: ${x.text}\n`;
    if(x.type=='mc')x.opts.forEach((o,k)=>out+=`${'ABCD'[k]==x.ans?'*':''}${'ABCD'[k]}. ${o}\n`);
    else if(x.type=='tf')x.opts.forEach((o,k)=>out+=`${x.ans[k]?'*':''}${'abcd'[k]}) ${o}\n`);
    else if(x.type=='sa')out+=`*ĐA: ${x.ans.join(' | ')}\n`;
    if(x.exp)out+=`*GT: ${x.exp}\n`;
  });
  return out.trim();
}
