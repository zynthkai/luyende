// ===== Parser đề thi nâng cấp (Hỗ trợ Đoạn Văn Tiếng Anh) =====
function parse(t){
  const qs=[];let cq=null,cg='',ig=false,md='text',m;
  t.replace(/\r/g,'').split('\n').forEach(ln=>{
    const tr=ln.trim();
    if(tr==='[ĐOẠN VĂN]'){ig=true;cg='';return}
    if(tr==='[/ĐOẠN VĂN]'){ig=false;return}
    if(ig){cg+=(cg?'\n':'')+tr;return} // Gom đoạn văn
    if(m=tr.match(/^\s*Câu\s*\d+\s*[:.]\s*(.*)$/)){
      if(cq)qs.push(cq);
      cq={text:m[1],mc:[],tf:[],sa:null,exp:'',group:cg};md='text'; // Gắn đoạn văn vào câu hỏi
    }else if(cq){
      if(m=tr.match(/^\s*(\*)?\s*([A-D])\.\s*(.*)$/)){cq.mc.push({t:m[3],c:!!m[1]});md='mc'}
      else if(m=tr.match(/^\s*(\*)?\s*([a-d])\)\s*(.*)$/)){cq.tf.push({t:m[3],c:!!m[1]});md='tf'}
      else if(m=tr.match(/^\s*\*\s*(?:ĐA|KQ)\s*:\s*(.*)$/i)){cq.sa=m[1].split('|').map(s=>s.trim()).filter(Boolean);md='sa'}
      else if(m=tr.match(/^\s*\*\s*GT\s*:\s*(.*)$/i)){cq.exp=m[1];md='exp'}
      else if(tr){if(md=='text')cq.text+=(cq.text?'\n':'')+tr;else if(md=='exp')cq.exp+='\n'+tr;else cq[md].at(-1).t+=' '+tr}
    }
  });
  if(cq)qs.push(cq);
  return qs.map(o=>{
    const x={text:o.text,exp:o.exp,group:o.group};
    if(o.mc.length>1)return{...x,type:'mc',opts:o.mc.map(a=>a.t),ans:'ABCD'[o.mc.findIndex(a=>a.c)]||''};
    if(o.tf.length>1)return{...x,type:'tf',opts:o.tf.map(a=>a.t),ans:o.tf.map(a=>a.c)};
    if(o.sa)return{...x,type:'sa',ans:o.sa};return null
  }).filter(Boolean);
}

 }catch(e){toast('Đăng nhập Google thất bại: '+(e.code||e.message),'err')}}

 if(x.type=='mc')body=x.ord.filter(o=>o<x.opts.length).map((o,p)=>`<button class="opt ${a===o?'sel':''}" onclick="ex.ans[${x.i}]=${o};render()"><b class="text-[#0891b2]">${'ABCD'[p]}.</b> ${rtf(x.opts[o])}</button>`).join('');

 else body=`<input class="inp mt-3" placeholder="Nhập đáp án..." value="${esc(a||'')}" oninput="ex.ans[${x.i}]=this.value;$('#pal').innerHTML=palH()">`;
 return `<div class="max-w-5xl mx-auto p-3 fade"><div class="card flex items-center gap-3 flex-wrap"><b class="mr-auto">${esc(q.title)}</b>${q.anti?`<span class="text-amber-600 text-sm" title="Số lần rời màn hình"><i class="fa fa-eye"></i> <span id="tb">${ex.tabs}</span></span>`:''}<b id="tm" class="text-xl text-[#0891b2]">${fmt(left())}</b><button class="btn bg" onclick="if(confirm('Nộp bài ngay?'))submit()">Nộp bài</button></div><div class="h-2 bg-slate-200 rounded-full my-3 overflow-hidden"><div class="h-full bg-[#10b981] transition-all" style="width:${n/qs.length*100}%"></div></div><div class="grid md:grid-cols-[1fr_220px] gap-3"><div class="card"><div class="flex justify-between"><h3 class="font-bold text-[#0891b2] mb-2">Câu ${cur+1}/${qs.length}: ${{mc:'Trắc nghiệm',tf:'Đúng/Sai',sa:'Trả lời ngắn'}[x.type]}</h3><button onclick="ex.flag[${x.i}]=!ex.flag[${x.i}];render()" class="${ex.flag[x.i]?'text-amber-600':'text-slate-400'}"><i class="fa fa-flag"></i> Phân vân</button></div>${x.group?`<div class="mb-4 p-4 bg-slate-50 border border-slate-200 rounded-xl whitespace-pre-line text-justify">${rtf(x.group)}</div>`:''}<p class="my-3 whitespace-pre-line font-medium">${rtf(x.text)}</p>${body}<div class="flex justify-between mt-5"><button class="btn b2" ${cur?'':'disabled'} onclick="ex.cur--;render()">Câu trước</button><button class="btn" ${cur<qs.length-1?'':'disabled'} onclick="ex.cur++;render()">Câu sau</button></div></div><div class="card h-fit"><p class="text-sm text-slate-500 mb-2">Đã làm ${n}/${qs.length}</p><div id="pal" class="grid grid-cols-5 gap-2">${palH()}</div></div></div></div>`}
const cheat=()=>{if(!ex||!ex.q.anti||Date.now()-ex.last<1500)return;ex.last=Date.now();ex.tabs++;toast(`Cảnh báo: bạn vừa rời khỏi màn hình làm bài (lần ${ex.tabs})`,'err');const e=$('#tb');if(e)e.textContent=ex.tabs};
document.addEventListener('visibilitychange',()=>document.hidden&&cheat());addEventListener('blur',cheat);
// ===== Chấm điểm =====
function grade(q,ans){let pts=0,ok=0;const per=10/q.qs.length;
 q.qs.forEach((x,i)=>{const a=ans[i];let f=0,full=0;
  if(x.type=='mc'){f=(x.ans&&a==='ABCD'.indexOf(x.ans))?1:0;full=f}
  else if(x.type=='tf'){const k=x.ans.filter((v,j)=>a?.[j]===v).length;f=[0,.1,.25,.5,1][k]||0;full=k==x.ans.length?1:0}
  else{f=(a&&x.ans.some(v=>nz(v)==nz(a)))?1:0;full=f}
  pts+=f*per;ok+=full});return{base:+pts.toFixed(2),ok}}
async function submit(){if(!ex)return;clearInterval(tm);const{q}=ex,t=Math.min(q.dur*60,Math.round((Date.now()-ex.t0)/1000)),g=grade(q,ex.ans),sp=+((g.base/10)*Math.max(0,1-t/(q.dur*60))*2).toFixed(2);
 const r={id:uid(),quizId:q.id,userId:me.id,name:me.name,classId:me.classId,answers:ex.ans,base:g.base,speed:sp,rank:+(g.base+sp).toFixed(2),ok:g.ok,total:q.qs.length,time:t,tabs:ex.tabs,ts:Date.now()};
 ex=null;await save('results',r);curR=r;view='res';render()}
const canRev=r=>quizOf(r)?.show||me.role=='admin';
const resH=()=>{const r=curR;return `<div class="card text-center max-w-md mx-auto space-y-2"><h2 class="text-xl font-bold">Đã nộp bài</h2><div class="text-5xl font-extrabold text-[#0891b2]">${r.rank}</div><p class="text-slate-500">Tổng điểm xếp hạng</p><p>Điểm gốc: <b>${r.base}</b>/10, thưởng tốc độ: <b class="text-[#059669]">+${r.speed}</b></p><p>Đúng ${r.ok}/${r.total} câu, thời gian ${fmt(r.time)}, chuyển tab ${r.tabs} lần</p><div class="flex gap-2 justify-center pt-2 flex-wrap">${canRev(r)?`<button class="btn" onclick="review('${r.id}')">Xem lại bài</button>`:''}<button class="btn b2" onclick="go('lb')">Xếp hạng</button><button class="btn b2" onclick="go('home')">Trang chủ</button></div></div>`};
function review(id){curR=S.results.find(r=>r.id==id);view='rev';render()}
function revH(){const r=curR,q=quizOf(r);if(!q||!canRev(r))return '<p>Đề này không cho phép xem lại đáp án.</p>';
 return `<h2 class="text-xl font-bold mb-3">Xem lại: ${esc(q.title)} (${r.base}/10)</h2>`+q.qs.map((x,i)=>{const a=r.answers[i];let b='';
  if(x.type=='mc')b=x.opts.map((o,k)=>`<div class="opt ${'ABCD'[k]==x.ans?'ok':a===k?'no':''}"><b>${'ABCD'[k]}.</b> ${rtf(o)}</div>`).join('');
  else if(x.type=='tf')b=x.opts.map((o,k)=>`<div class="opt ${a?.[k]===x.ans[k]?'ok':'no'}"><b>${'abcd'[k]})</b> ${rtf(o)}<br><span class="text-sm">Đáp án: <b>${x.ans[k]?'Đúng':'Sai'}</b>. Bạn chọn: ${a?.[k]==null?'chưa chọn':a[k]?'Đúng':'Sai'}</span></div>`).join('');
  else b=`<div class="opt ${a&&x.ans.some(v=>nz(v)==nz(a))?'ok':'no'}">Bạn trả lời: ${esc(a||'(trống)')}</div><div class="opt ok">Đáp án: ${esc(x.ans.join(' | '))}</div>`;
  return `<div class="card mb-4"><b class="text-[#0891b2] mb-2 inline-block">Câu ${i+1}</b>${x.group?`<div class="mb-2 p-3 bg-slate-50 border border-slate-200 rounded-xl whitespace-pre-line text-sm text-justify">${rtf(x.group)}</div>`:''}<p class="whitespace-pre-line my-2 font-medium">${rtf(x.text)}</p>${b}${x.exp?`<div class="mt-3 p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/40 whitespace-pre-line"><b>Lời giải:</b> ${rtf(x.exp)}</div>`:''}</div>`}).join('')+`<button class="btn b2" onclick="go('home')">Về trang chủ</button>`}
// ===== Xếp hạng & CSV =====
const lbRows=()=>{const b={};S.results.filter(r=>r.quizId==lb.q&&(!lb.c||r.classId==lb.c)).forEach(r=>{if(!b[r.userId]||r.rank>b[r.userId].rank)b[r.userId]=r});return Object.values(b).sort((a,c)=>c.rank-a.rank)};
function lbH(){if(!lb.q)lb.q=S.quizzes[0]?.id||'';const rows=lbRows();
 return `<div class="card"><div class="flex flex-wrap gap-2 mb-3"><select class="inp" style="width:auto" onchange="lb.q=this.value;render()">${S.quizzes.map(q=>`<option value="${q.id}" ${q.id==lb.q?'selected':''}>${esc(q.title)}</option>`).join('')}</select><select class="inp" style="width:auto" onchange="lb.c=this.value;render()"><option value="">Tất cả lớp</option>${clsOpts(lb.c)}</select>${me.role=='admin'?`<button class="btn bg ml-auto" onclick="csv()"><i class="fa fa-file-excel"></i> Xuất Bảng Điểm (.CSV / Excel)</button>`:''}</div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-slate-500"><tr><th class="p-2">Hạng</th><th>Học sinh</th><th>Điểm xếp hạng</th><th>Điểm gốc</th><th>Câu đúng</th><th>Thời gian</th><th>Chuyển tab</th></tr></thead><tbody>${rows.map((r,i)=>{const u=S.users.find(x=>x.id==r.userId)||{username:r.userId};return `<tr class="border-t border-slate-200"><td class="p-2 text-xl">${['🥇','🥈','🥉'][i]||i+1}</td><td><div class="flex items-center gap-2"><img src="${av(u)}" class="w-8 h-8 rounded-full object-cover"><div><b>${esc(r.name)}</b><div class="text-xs text-slate-500">${esc(cn(r.classId))}</div></div></div></td><td class="text-lg font-extrabold text-[#0891b2]">${r.rank}</td><td>${r.base}</td><td>${r.ok}/${r.total}</td><td>${fmt(r.time)}</td><td>${r.tabs}</td></tr>`}).join('')||'<tr><td colspan="7" class="p-4 text-slate-500">Chưa có kết quả nào.</td></tr>'}</tbody></table></div></div>`}
function csv(){const q=S.quizzes.find(x=>x.id==lb.q),h=['Hạng','Họ tên','Tài khoản','Lớp','Điểm xếp hạng','Điểm gốc','Thưởng tốc độ','Số câu đúng','Thời gian','Chuyển tab'];
 const s=[h,...lbRows().map((r,i)=>[i+1,r.name,S.users.find(u=>u.id==r.userId)?.username,cn(r.classId),r.rank,r.base,r.speed,r.ok,fmt(r.time),r.tabs])].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));l.download=`bang-diem-${q?.title||'de'}.csv`;l.click()}
// ===== Admin: tạo đề =====
function quizForm(){modal(`<h3 class="text-xl font-bold mb-3">Tạo đề mới</h3><div class="grid gap-3 md:grid-cols-2"><input id="qt" class="inp md:col-span-2" placeholder="Tên đề thi"><input id="qd" type="number" class="inp" value="45" min="1" title="Thời gian (phút)"><select id="qc" class="inp"><option value="">Tất cả các lớp</option>${clsOpts()}</select><select id="qm" class="inp"><option value="multi">Luyện tập (làm nhiều lần)</option><option value="once">Kiểm tra (chỉ 1 lần)</option></select><div class="text-sm space-y-1"><label><input type="checkbox" id="q1"> Đảo thứ tự câu hỏi và đáp án</label><br><label><input type="checkbox" id="q2" checked> Chống gian lận (đếm chuyển tab)</label><br><label><input type="checkbox" id="q3" checked> Cho xem đáp án và lời giải</label></div></div><input type="file" accept=".txt" class="my-3 text-sm" onchange="readTxt(this)"><textarea id="qx" rows="10" class="inp font-mono text-sm" placeholder="[ĐOẠN VĂN]\nBài đọc hiểu... \n[/ĐOẠN VĂN]\n\nCâu 1: Từ gạch chân _the_ sai ở đâu?\nA. ...\n*B. ... (dấu * = đáp án đúng)"></textarea><div class="flex gap-2 mt-3"><button class="btn b2" onclick="prev()">Xem trước</button><button class="btn bg" onclick="saveQ()">Lưu đề</button></div><div id="pv" class="mt-3 space-y-2 text-sm"></div>`)}
function readTxt(el){const f=el.files[0];if(f){const r=new FileReader();r.onload=()=>$('#qx').value=r.result;r.readAsText(f)}}
function prev(){const p=parse($('#qx').value);$('#pv').innerHTML=`<b class="text-[#059669]">Đã nhận ${p.length} câu hỏi</b>`+p.map((x,i)=>`<div class="p-2 rounded-lg bg-slate-100"><b>Câu ${i+1}</b> [${x.type}] ${x.group?`<div class="text-xs text-slate-500 border-l-2 border-slate-400 pl-2 mb-1">${rtf(x.group).substring(0,100)}...</div>`:''}${rtf(x.text)}<br><span class="text-slate-500">${x.opts?x.opts.map((o,k)=>(x.type=='mc'?'ABCD'[k]+'. ':(x.ans[k]?'✔ ':'✘ '))+rtf(o)).join(' | '):''}</span><br>Đáp án: <b class="text-[#0891b2]">${esc(x.type=='tf'?x.ans.map(v=>v?'Đ':'S').join(' '):x.type=='mc'?(x.ans||'⚠ thiếu dấu *'):x.ans.join(' | '))}</b>${x.exp?' (có lời giải)':''}</div>`).join('');math()}
async function saveQ(){const qs=parse($('#qx').value),t=$('#qt').value.trim();if(!t||!qs.length)return toast('Cần nhập tên đề và ít nhất 1 câu hỏi hợp lệ','err');
 await save('quizzes',{id:uid(),title:t,dur:+$('#qd').value||45,classId:$('#qc').value,mode:$('#qm').value,shuffle:$('#q1').checked,anti:$('#q2').checked,show:$('#q3').checked,qs});modal('');toast(`Đã lưu đề (${qs.length} câu)`);render()}
// ===== Admin: lớp học =====
function clsMgr(){modal(`<h3 class="text-xl font-bold mb-3">Quản lý lớp</h3><div class="flex gap-2 mb-3"><input id="nc" class="inp" placeholder="Tên lớp mới"><button class="btn bg" onclick="addC()">Thêm</button></div>${S.classes.map(c=>{const m=S.users.filter(u=>u.classId==c.id);return `<div class="card mb-2"><div class="flex gap-2 items-center"><b class="mr-auto">${esc(c.name)} <span class="text-slate-500 text-sm">(${m.length} thành viên)</span></b><button class="btn b2" onclick="renC('${c.id}')"><i class="fa fa-pen"></i></button><button class="btn br" onclick="delC('${c.id}')"><i class="fa fa-trash"></i></button></div><p class="text-sm text-slate-500 mt-1">${m.map(u=>esc(u.name)).join(', ')||'Chưa có thành viên'}</p></div>`}).join('')}`)}
async function addC(){const n=$('#nc').value.trim();if(!n)return;await save('classes',{id:uid(),name:n});toast('Đã thêm lớp');clsMgr()}
async function renC(id){const c=S.classes.find(x=>x.id==id),n=prompt('Tên lớp mới:',c.name);if(n?.trim()){c.name=n.trim();await save('classes',c);toast('Đã đổi tên lớp');clsMgr();render()}}
async function delC(id){if(!confirm('Xóa lớp này?'))return;for(const u of S.users.filter(u=>u.classId==id)){u.classId='';await save('users',u)}await del('classes',id);toast('Đã xóa lớp');clsMgr();render()}
// ===== Hồ sơ =====
const AVS=['Felix','Aneka','Luna','Milo','Zoe','Leo','Mia','Max'];
function profile(){newAv=null;modal(`<h3 class="text-xl font-bold mb-3">Hồ sơ cá nhân</h3><div class="flex items-center gap-3 mb-3 flex-wrap"><img id="pa" src="${av(me)}" class="w-20 h-20 rounded-full border-2 border-[#06b6d4] object-cover"><div><div class="flex flex-wrap gap-1">${AVS.map(s=>{const u=`https://api.dicebear.com/7.x/adventurer/svg?seed=${s}`;return `<img src="${u}" class="w-10 h-10 rounded-full cursor-pointer hover:ring-2 ring-[#10b981]" onclick="setAv('${u}')">`}).join('')}</div><label class="btn b2 inline-block mt-2 cursor-pointer text-sm"><i class="fa fa-upload"></i> Tải ảnh lên<input type="file" accept="image/*" hidden onchange="upAv(this)"></label></div></div><div class="grid gap-2"><input id="pn" class="inp" value="${esc(me.name)}" placeholder="Họ và tên"><input id="pb" class="inp" value="${esc(me.bio)}" placeholder="Châm ngôn học tập"><select id="pc" class="inp">${clsOpts(me.classId)}</select><input id="pp" type="password" class="inp" placeholder="Mật khẩu mới (bỏ trống nếu không đổi)"></div><button class="btn bg mt-3" onclick="saveP()">Lưu hồ sơ</button>`)}
const setAv=u=>{newAv=u;$('#pa').src=u};
function upAv(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=150;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,150,150);setAv(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
async function saveP(){const n=$('#pn').value.trim();if(!n)return toast('Họ tên không được trống','err');Object.assign(me,{name:n,bio:$('#pb').value.trim(),classId:$('#pc').value});
 if(newAv)me.avatar=newAv;if($('#pp').value)me.pass=$('#pp').value;await save('users',me);modal('');toast('Đã cập nhật hồ sơ');render()}
// ===== Khởi động =====
(async()=>{try{await load()}catch(e){useFB=false;toast('Không kết nối được Firebase, chuyển sang localStorage','err');await load()}
 await seed();me=S.users.find(u=>u.id==localStorage.getItem('qz_me'))||null;render()})();
</script></body></html>
